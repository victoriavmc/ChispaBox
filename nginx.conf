# Configuración de producción para la landing estática (Nginx Alpine).
# Se copia a /etc/nginx/conf.d/default.conf dentro de la imagen.
#
# Nota: en Nginx, un "add_header" dentro de una location reemplaza a los heredados del bloque
# server. Por eso las cabeceras de seguridad se definen una sola vez aquí y las locations
# usan "expires" (que genera Cache-Control) en lugar de add_header.


server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Sin registro de accesos en el contenedor: Caddy es el único registro de accesos HTTP (30 días).
    # Los errores técnicos siguen en error_log (stderr del contenedor).
    access_log off;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Compresión de texto (HTML, CSS, JS, SVG, JSON)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' https://es.wiktionary.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Descargas de YouTube: el API no existe en la imagen estática. Se bloquea también aquí
    # (defensa en profundidad) para que ninguna petición llegue a un backend si alguna vez se añade uno.
    location ^~ /api/youtube/ {
        return 404;
    }

    # Archivos con hash en el nombre (assets/*): caché larga
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Ilustraciones, logo y favicon: caché moderada
    location /images/ {
        expires 30d;
        try_files $uri =404;
    }

    # Enlaces cortos del acortador (/s/CODIGO): se sirve la página del acortador sin cambiar la URL.
    location ~ "^/s/[A-Za-z0-9]{7}/?$" {
        rewrite ^ /paginas/acortador-enlaces/index.html break;
    }

    location = /favicon.png {
        expires 30d;
    }

    location = /theme-init.js {
        expires 1d;
    }

    # Página 404 personalizada: responde con código 404 real (no con index.html).
    error_page 404 /404.html;

    # Página principal y páginas locales: el HTML no se cachea de forma prolongada
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    # No exponer archivos ocultos
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
