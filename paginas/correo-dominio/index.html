<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Revisa MX, SPF, DKIM (selectores comunes) y DMARC de un dominio para ver si su correo está protegido." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#E61932" />
    <title>Correo: SPF, DKIM y DMARC | ChispaBox</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <!-- Aplica la preferencia guardada antes del primer pintado (evita parpadeo de tema). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!-- @include:sprite -->

    <!-- @include:header -->

    <main id="main">
      <div class="container tool-page">
        <!-- @include:encabezado titulo="Correo: SPF, DKIM y DMARC" subtitulo="Revisá si el correo de un dominio está bien configurado para entregar mensajes y evitar suplantaciones, incluidos los selectores DKIM más comunes." personaje="/images/characters/enzo-cutout-w400.webp" -->

        <div class="doc-panel">
          <h2 class="doc-panel__title">Revisar el correo del dominio</h2>

          <section class="rec-panel" aria-labelledby="cor-entrada-heading">
            <h3 class="field-label" id="cor-entrada-heading">1. Dominio</h3>
            <div class="red-aviso"><strong>Servicio externo.</strong> Se consulta <code>dns.google</code>. No se envía ningún correo ni se conecta con el servidor de correo.</div>
            <form class="red-form" id="cor-form" novalidate>
              <div class="red-form__fila">
                <label class="field-label" for="cor-entrada" hidden>Dominio</label>
                <input class="red-input" id="cor-entrada" type="text" autocomplete="off" spellcheck="false" maxlength="253" placeholder="ejemplo.com" />
                <button type="submit" class="btn btn--primary" id="cor-btn">Revisar correo</button>
              </div>
            </form>
            <p class="rec-error" id="cor-error" role="alert" hidden></p>
          </section>

          <section class="rec-panel" aria-labelledby="cor-resultado-heading">
            <h3 class="field-label" id="cor-resultado-heading">2. Resultado</h3>
            <div class="red-resultado" id="cor-resultado" hidden>
              <ul class="dns-chequeos" id="cor-chequeos"></ul>
              <p class="tool-note" id="cor-dkim"></p>
            </div>
          </section>

          <p class="rec-status" id="cor-status" role="status" aria-live="polite"></p>
        </div>

      </div>
    </main>

    <!-- @include:footer -->

    <script type="module" src="/src/scripts/main.ts"></script>
    <script type="module" src="/src/scripts/correo-dominio.ts"></script>
  </body>
</html>
