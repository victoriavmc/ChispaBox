<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Comprueba el certificado HTTPS de un sitio: si es válido, quién lo emitió y cuántos días le quedan. Solo en la versión local." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#E61932" />
    <title>Verificar SSL | ChispaBox</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <!-- Aplica la preferencia guardada antes del primer pintado (evita parpadeo de tema). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!-- @include:sprite -->

    <!-- @include:header -->

    <main id="main">
      <div class="container tool-page">
        <!-- @include:encabezado titulo="Verificar SSL" subtitulo="Comprobá si el certificado HTTPS de un sitio es válido, quién lo emitió y cuántos días le quedan." personaje="/images/characters/marcos-cutout-w400.webp" -->

        <div class="doc-panel">
          <h2 class="doc-panel__title">Ver el certificado de un sitio</h2>

          <section class="rec-panel" aria-labelledby="ssl-entrada-heading">
            <h3 class="field-label" id="ssl-entrada-heading">1. Sitio</h3>
            <div class="red-aviso"><strong>Solo en la versión local.</strong> Esta consulta la hace el servidor local de ChispaBox (extras/local), no tu navegador. En la versión pública no está disponible.</div>
            <form class="red-form" id="ssl-form" novalidate>
              <div class="red-form__fila">
                <label class="field-label" for="ssl-entrada" hidden>Dominio</label>
                <input class="red-input" id="ssl-entrada" type="text" autocomplete="off" spellcheck="false" maxlength="2048" placeholder="chispabox.io" />
                <button type="submit" class="btn btn--primary" id="ssl-btn">Verificar</button>
              </div>
            </form>
            <p class="rec-error" id="ssl-error" role="alert" hidden></p>
          </section>

          <section class="rec-panel" aria-labelledby="ssl-resultado-heading">
            <h3 class="field-label" id="ssl-resultado-heading">2. Resultado</h3>
            <div class="red-resultado" id="ssl-resultado" hidden>
              <div class="ip-titular" id="ssl-banner" hidden></div>
              <dl class="red-datos" id="ssl-datos"></dl>
            </div>
          </section>

          <p class="rec-status" id="ssl-status" role="status" aria-live="polite"></p>
        </div>

      </div>
    </main>

    <!-- @include:footer -->

    <script type="module" src="/src/scripts/main.ts"></script>
    <script type="module" src="/src/scripts/dominio-ssl.ts"></script>
  </body>
</html>
