<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Convierte dominios con ñ, tildes u otros alfabetos a su forma ASCII (xn--) y al revés. Todo en tu navegador." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#E61932" />
    <title>Convertidor Punycode | ChispaBox</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <!-- Aplica la preferencia guardada antes del primer pintado (evita parpadeo de tema). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!-- @include:sprite -->

    <!-- @include:header -->

    <main id="main">
      <div class="container tool-page">
        <!-- @include:encabezado titulo="Convertidor Punycode" subtitulo="Pasá dominios con ñ, tildes u otros alfabetos a su forma ASCII (xn--), y al revés. La conversión se hace en tu navegador." personaje="/images/characters/florencia-cutout-w400.webp" -->

        <div class="doc-panel">
          <h2 class="doc-panel__title">Convertir un dominio</h2>

          <section class="rec-panel" aria-labelledby="pun-entrada-heading">
            <h3 class="field-label" id="pun-entrada-heading">1. Dominio</h3>
            <form class="red-form" id="pun-form" novalidate>
              <div class="red-form__fila">
                <label class="field-label" for="pun-entrada" hidden>Dominio</label>
                <input class="red-input" id="pun-entrada" type="text" autocomplete="off" spellcheck="false" maxlength="253" placeholder="münchen.de o xn--mnchen-3ya.de" />
                <button type="submit" class="btn btn--primary" id="pun-btn-ascii">A ASCII (xn--)</button>
                <button type="button" class="btn btn--ghost" id="pun-btn-texto">A texto con tildes</button>
              </div>
            </form>
            <p class="rec-error" id="pun-error" role="alert" hidden></p>
          </section>

          <section class="rec-panel" aria-labelledby="pun-resultado-heading">
            <h3 class="field-label" id="pun-resultado-heading">2. Resultado</h3>
            <div class="red-resultado" id="pun-resultado" hidden>
              <dl class="red-datos" id="pun-datos"></dl>
            </div>
          </section>

          <p class="rec-status" id="pun-status" role="status" aria-live="polite"></p>
        </div>

      </div>
    </main>

    <!-- @include:footer -->

    <script type="module" src="/src/scripts/main.ts"></script>
    <script type="module" src="/src/scripts/punycode.ts"></script>
  </body>
</html>
