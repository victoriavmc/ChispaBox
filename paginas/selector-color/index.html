<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Tocá un píxel de una imagen y obtené su color en HEX, RGB, HSL y HSV. Todo se procesa en tu navegador, sin servicios externos."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#E61932" />
    <title>Selector de color | ChispaBox</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <!-- Aplica la preferencia guardada antes del primer pintado (evita parpadeo de tema). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!-- @include:sprite -->

    <!-- @include:header -->

    <main id="main">
      <div class="container tool-page">
        <!-- @include:encabezado titulo="Selector de color" subtitulo="Tocá un píxel de una imagen y obtené su valor en HEX, RGB, HSL y HSV. La imagen se abre en tu navegador: no se sube a ningún servidor." personaje="/images/characters/miles-cutout.webp" -->

        <div id="panel-color" class="doc-panel">
          <h2 class="doc-panel__title">Elegir un color</h2>

          <section class="rec-panel" aria-labelledby="color-sel-heading">
            <h3 class="field-label" id="color-sel-heading">1. Cargar una imagen</h3>
            <div class="tool-req" aria-label="Requisitos de entrada">
              <p class="tool-req__title">Antes de cargar</p>
              <ul class="tool-req__list" id="color-requirements"></ul>
            </div>
            <div class="tool-dropzone" id="color-dropzone">
              <label class="field-label" for="color-file">Seleccionar una imagen o arrastrarla aquí</label>
              <input class="bg-file" id="color-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" />
            </div>
            <p class="rec-error" id="color-error" role="alert" hidden></p>
          </section>

          <section class="rec-panel" aria-labelledby="color-pick-heading">
            <h3 class="field-label" id="color-pick-heading">2. Elegir el píxel</h3>
            <p class="tool-note">Hacé clic sobre la imagen, o escribí las coordenadas si usás el teclado.</p>
            <div class="color-stage">
              <canvas id="color-canvas" class="color-canvas" aria-label="Imagen para elegir un color" hidden></canvas>
            </div>
            <div class="color-coords" id="color-coords-wrap" hidden>
              <label class="field-label" for="color-x">X</label>
              <input class="tool-select color-coord" id="color-x" type="number" min="0" step="1" />
              <label class="field-label" for="color-y">Y</label>
              <input class="tool-select color-coord" id="color-y" type="number" min="0" step="1" />
              <button type="button" class="btn btn--ghost" id="color-apply">Usar estas coordenadas</button>
            </div>
          </section>

          <section class="rec-panel" aria-labelledby="color-result-heading">
            <h3 class="field-label" id="color-result-heading">3. Valores del color</h3>
            <div class="color-result" id="color-result" hidden>
              <div class="color-swatch" id="color-swatch" aria-hidden="true"></div>
              <dl class="color-values" id="color-values"></dl>
              <p class="tool-note" id="color-alpha-note" hidden></p>
            </div>
            <p class="tool-note" id="color-empty">Todavía no elegiste ningún píxel.</p>
          </section>

          <p class="rec-status" id="color-status" role="status" aria-live="polite"></p>
        </div>
      </div>
    </main>

    <!-- @include:footer -->

    <script type="module" src="/src/scripts/main.ts"></script>
    <script type="module" src="/src/scripts/selector-color.ts"></script>
  </body>
</html>
