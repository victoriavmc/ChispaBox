<a class="skip-link" href="#main">Saltar al contenido</a>

<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="/" aria-label="ChispaBox, ir al inicio">
      <img
        class="brand__mark"
        src="/images/logo/chispabox-logo.webp"
        width="512"
        height="512"
        alt=""
        aria-hidden="true"
      />
      <span class="brand__text">
        <strong>Chispa<span class="brand__accent">Box</span></strong>
        <small>Pequeñas herramientas, grandes soluciones.</small>
      </span>
    </a>

    <div class="header-actions">
      <nav class="site-nav" aria-label="Principal">
        <div class="menu-herr" data-menu-herr>
          <button
            type="button"
            class="menu-herr__btn"
            aria-expanded="false"
            aria-controls="menu-herr-panel"
            data-menu-herr-btn
          >
            <svg class="icon" aria-hidden="true"><use href="#i-lines" /></svg>
            <span>Herramientas</span>
          </button>
          <div class="menu-herr__panel" id="menu-herr-panel" hidden>
            <p class="menu-herr__titulo">Ir a una categoría</p>
            <ul class="menu-herr__lista">
              <li><a class="menu-herr__link" href="/#herramientas">Todas las herramientas</a></li>
              <li><a class="menu-herr__link" href="/#cat-audio">Audio</a></li>
              <li><a class="menu-herr__link" href="/#cat-texto">Texto y escritura</a></li>
              <li><a class="menu-herr__link" href="/#cat-imagenes">Imágenes y diseño</a></li>
              <li><a class="menu-herr__link" href="/#cat-documentos">Documentos y PDF</a></li>
              <li><a class="menu-herr__link" href="/#cat-datos">Datos y desarrollo</a></li>
              <li><a class="menu-herr__link" href="/#cat-seguridad">Seguridad</a></li>
              <li><a class="menu-herr__link" href="/#cat-networking">Networking</a></li>
              <li><a class="menu-herr__link" href="/#cat-dominios">Dominios</a></li>
              <li><a class="menu-herr__link" href="/#cat-web">Herramientas web</a></li>
            </ul>
          </div>
        </div>
      </nav>

      <button
        type="button"
        class="theme-toggle"
        id="theme-toggle"
        aria-label="Cambiar a tema oscuro"
      >
        <svg
          class="icon theme-toggle__icon theme-toggle__icon--moon"
          aria-hidden="true"
        >
          <use href="#i-moon" />
        </svg>
        <svg
          class="icon theme-toggle__icon theme-toggle__icon--sun"
          aria-hidden="true"
        >
          <use href="#i-sun" />
        </svg>
        <span class="theme-toggle__label" aria-hidden="true">Oscuro</span>
      </button>
    </div>
  </div>
</header>
